# Render blueprint for the Nebula API. In Render: New > Blueprint > pick this repo.
# Values marked sync: false are asked for in the Render dashboard and never stored in the repo.
services:
  - type: web
    name: nebula-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "2" # Vercel forwards API calls, then Render's own proxy
      - key: COOKIE_SAMESITE
        value: lax # the Vercel proxy makes the login cookie first-party
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: SESSION_DAYS
        value: "1"
      - key: SESSION_REMEMBER_DAYS
        value: "30"
      - key: CLIENT_URL # your exact Vercel address, e.g. https://nebula.vercel.app
        sync: false
      - key: CORS_ORIGIN # the same Vercel address
        sync: false
      - key: DATABASE_URL # Neon connection string
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET # unused now, but still required at startup
        sync: false
      - key: KEY_ENCRYPTION_SECRET # 64 hex characters; changing it makes saved user keys unreadable
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional shared AI keys. Leave them out so every user must add their own.
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
